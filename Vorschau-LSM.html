<style>

  .lsm { background:var(--sand); --lsm-neon:#63f655; --lsm-schwarz:#050a06; --lsm-grau:#acadae; --lsm-schrift:"Archivo V", "Archivo", var(--display); }

  .lsm-btn { display:inline-flex; align-items:center; justify-content:center; gap:12px; min-height:58px; margin-top:clamp(30px,3.6vw,44px); padding:15px 28px; border-radius:12px; background:linear-gradient(90deg,#74ff6c,#3efb0a); color:#0d2202; font-family:var(--lsm-schrift); font-weight:700; font-size:1.02rem; line-height:1.25; text-align:center; box-shadow:0 0 28px rgba(90,250,60,.35), inset 0 1px 0 rgba(255,255,255,.35); transition:transform .3s var(--ease), box-shadow .3s ease; }

  .lsm-nb { white-space:nowrap; }
  .lsm-phone { justify-self:center; width:min(100%,220px); }

  @media (max-width:619px) {

  @media (min-width:900px) {
